name: Release

# Version, tag and changelog — release-please and nothing else. This workflow
# builds no artifact and uploads none, so a tag published from here carries no
# downloadable asset. That gap is the current state of the repo rather than an
# oversight: the distributable arrives with #1904.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please's PR/branch pushes need an identity other than the
      # default GITHUB_TOKEN: GitHub Actions refuses to trigger further
      # workflow runs from a GITHUB_TOKEN-authored push (anti-recursion),
      # which leaves the release PR's required status checks stuck
      # "Expected" and unmergeable. A GitHub App installation token is one
      # fix (tried first here, reverted — see git history — because a
      # single-owner repo has no one else to scope App permissions away
      # from, so it bought nothing over a PAT for twice the setup: create
      # an App, install it, mint and rotate a private key). A classic PAT
      # from the repo owner's own account is the other, simpler fix: one
      # token, one secret, same anti-recursion bypass.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
